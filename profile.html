<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — Transpo</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/storage.js"></script>
  <script src="js/nav.js"></script>

  <script>
    (function () {
      if (!PTB.getCurrentUser()) {
        location.replace('login.html');
      }
    })();
  </script>
</head>
<body>
  <div class="app">
    <div id="site-header"></div>

        <div class="profile-avatar" id="profileAvatar"></div>
    <h2 class="profile-name" id="profileName"></h2>

    <div id="alertSuccess" class="alert alert-success" role="status"></div>

    <div style="height:2rem"></div>
    <div class="card">
      <form id="profileForm" novalidate>
        <div class="form-group">
          <label class="label" for="fullName">Complete Name</label>
          <input class="input" type="text" id="fullName" name="fullName" autocomplete="name" disabled>
          <p class="field-error" id="nameError">Please enter your complete name.</p>
        </div>

        <div class="form-group">
          <label class="label" for="phone">Phone Number</label>
          <input class="input" type="tel" id="phone" name="phone" autocomplete="tel" disabled>
          <p class="field-error" id="phoneError">Please enter a valid phone number.</p>
        </div>

        <div class="form-group">
          <label class="label" for="address">Address</label>
          <input class="input" type="text" id="address" name="address" autocomplete="street-address" disabled>
          <p class="field-error" id="addressError">Please enter your address.</p>
        </div>

        <button type="button" id="editInfoBtn" class="btn btn-primary btn-block">Edit Information</button>
        <button type="submit" id="updateInfoBtn" class="btn btn-primary btn-block hidden mt-8">Update Information</button>
        <button type="button" id="cancelBtn" class="btn btn-outline btn-block hidden mt-8">Cancel</button>
      </form>
    </div>

    <div class="card mt-16">
      <div class="muted" style="font-size:13.5px; margin-bottom:14px">
        Logging out keeps your booking history saved on this device. Log back in anytime with your email and password.
      </div>
      <button type="button" id="logoutBtn" class="btn btn-danger btn-block">Log Out</button>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/arrival-notice.js"></script>

  <script src="js/profile.js"></script>
</body>
</html>
