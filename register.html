<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Transpo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <h1>Create your account</h1>

      <div id="alertError" class="alert alert-error" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="label" for="fullName">Complete Name</label>
          <input class="input" type="text" id="fullName" name="fullName" placeholder="Juan Dela Cruz" autocomplete="name">
          <p class="field-error" id="fullNameError">Please enter your complete name.</p>
        </div>

        <div class="form-group">
          <label class="label" for="email">Email</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
          <p class="field-error" id="emailError">Enter a valid email address.</p>
        </div>

        <div class="form-group">
          <label class="label" for="password">Password</label>
          <div class="password-wrap">
            <input class="input" type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password">
            <button type="button" class="toggle-pw" data-toggle-for="password">Show</button>
          </div>
          <p class="field-error" id="passwordError">Password must be at least 6 characters.</p>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/footer.js"></script>

  <script src="js/storage.js"></script>
  <script>
    (function () {
      if (PTB.getCurrentUser()) {
        location.replace('dashboard.html');
      }
    })();
  </script>
  <script src="js/register.js"></script>
</body>
</html>
