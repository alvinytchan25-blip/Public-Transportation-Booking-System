<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking History — Transpo</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="js/storage.js"></script>
  <script src="js/nav.js"></script>

  <script>
    (function () {
      if (!PTB.getCurrentUser()) {
        location.replace('login.html');
      }
    })();
  </script>
</head>
<body>
  <div class="app">
    <div id="site-header"></div>

    <h1 class="page-title" id="historyTitle">Booking History</h1>
    <p class="page-sub" id="historySub">Your completed bookings will be saved here.</p>

    <nav class="filter-tabs" id="historyTabs" aria-label="Filter bookings by status"></nav>

    <div id="historyNotice" class="retention-banner hidden"></div>

    <div id="historyList"></div>

    <button type="button" id="historyMore" class="show-more hidden">Show more</button>

    <div id="emptyState" class="empty-state hidden">
      <div class="em-icon">🗒</div>
      <h3 id="emptyTitle">No bookings yet</h3>
      <p id="emptyText">Your booking history will appear here once you finish your first ride.</p>
      <a href="services.html" id="emptyCta" class="btn btn-primary">Book Your First Ride</a>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/arrival-notice.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/track.js"></script>
<script src="js/driver-tracking.js"></script>
<script src="js/booking-card.js"></script>
<script src="js/activebookings.js"></script>
<script src="js/cancelledbookings.js"></script>
<script src="js/completedbookings.js"></script>
<script src="js/history.js"></script>
</body>
</html>
