<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Transpo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <h1>Login</h1>
      <p class="sub">Log in to book your next ride.</p>

      <div id="alertError" class="alert alert-error" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="label" for="email">Email</label>
          <input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
          <p class="field-error" id="emailError">Enter a valid email address.</p>
        </div>

        <div class="form-group">
          <label class="label" for="password">Password</label>
          <div class="password-wrap">
            <input class="input" type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password">
            <button type="button" class="toggle-pw" data-toggle-for="password">Show</button>
          </div>
          <p class="field-error" id="passwordError">Password is required.</p>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Log In</button>
      </form>

      <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/footer.js"></script>

  <script src="js/storage.js"></script>
  <script>
    (function () {
      if (PTB.getCurrentUser()) {
        location.replace('dashboard.html');
      }
    })();
  </script>
  <script src="js/login.js"></script>
</body>
</html>
