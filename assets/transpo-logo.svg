<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square tile -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#g)"/>

  <!-- Road / route band -->
  <path d="M10 46 C18 34, 26 30, 32 24 C38 18, 46 16, 52 12"
        fill="none" stroke="url(#road)" stroke-width="5" stroke-linecap="round"/>

  <!-- Dashed center line on road -->
  <path d="M10 46 C18 34, 26 30, 32 24 C38 18, 46 16, 52 12"
        fill="none" stroke="#ffffff" stroke-width="1.6" stroke-dasharray="3 4" stroke-linecap="round"/>

  <!-- Start pin -->
  <circle cx="10" cy="46" r="4" fill="#f97316"/>
  <circle cx="10" cy="46" r="1.7" fill="#ffffff"/>

  <!-- Destination pin -->
  <circle cx="52" cy="12" r="4" fill="#f97316"/>
  <circle cx="52" cy="12" r="1.7" fill="#ffffff"/>

  <!-- Moving vehicle on the route -->
  <circle cx="30" cy="26" r="5" fill="#ffffff"/>
  <circle cx="30" cy="26" r="2" fill="url(#g)"/>
</svg>
