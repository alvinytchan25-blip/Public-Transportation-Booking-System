<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Transpo</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/storage.js"></script>
  <script src="js/nav.js"></script>

  <script>
    (function () {
      if (!PTB.getCurrentUser()) {
        location.replace('login.html');
      }
    })();
  </script>
</head>
<body>
  <div class="app">
    <div id="site-header"></div>

    <section class="hero-card">
      <h2>Hello, <span id="userName">Rider</span>! 👋</h2>
      <p id="welcomeLine">Ready for your next trip?</p>
    </section>

    <div class="menu-grid">
      <div class="menu-card clickable" data-goto="services.html">
        <span class="menu-icon">📍</span>
        <div class="menu-label">Quick Book</div>
        <div class="menu-desc">Start booking right away</div>
      </div>
      <div class="menu-card clickable" data-goto="scheduled.html">
        <span class="menu-icon">🏍</span>
        <div class="menu-label">Schedule a Ride</div>
        <div class="menu-desc">Plan your trip in advance</div>
      </div>
      <div class="menu-card clickable" data-goto="history.html">
        <span class="menu-icon">📜</span>
        <div class="menu-label">Booking History</div>
        <div class="menu-desc">View or cancel bookings</div>
      </div>
      <div class="menu-card clickable" data-goto="profile.html">
        <span class="menu-icon">👤</span>
        <div class="menu-label">My Profile</div>
        <div class="menu-desc">Edit account details</div>
      </div>
    </div>

    <div class="dashboard-stats">
      <div class="stat-card" data-status="Active">
        <div class="stat-value" id="statActive">0</div>
        <div class="stat-label">Active bookings</div>
      </div>
      <div class="stat-card" data-status="Cancelled">
        <div class="stat-value" id="statCancelled">0</div>
        <div class="stat-label">Cancelled Bookings</div>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/arrival-notice.js"></script>

  <script src="js/dashboard.js"></script>
</body>
</html>
